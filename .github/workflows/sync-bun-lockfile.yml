name: Synchronize Bun Lockfile

on:
  push:
    branches:
      - ai-development
    paths:
      - package.json
      - bun.lock
      - .github/workflows/sync-bun-lockfile.yml

permissions:
  contents: write

jobs:
  sync-lockfile:
    name: Regenerate and commit Bun lockfile when needed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: ai-development
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Regenerate lockfile from package.json
        run: bun install

      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- bun.lock; then
            echo "Bun lockfile is already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: synchronize Bun lockfile"
          git push origin HEAD:ai-development
